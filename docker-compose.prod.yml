name: arbion-production

x-api-environment: &api-environment
  ARBION_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
  DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-2}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
  AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?AUTH_ALLOWED_ORIGINS is required}
  REGISTRATION_ALLOWLIST: ${REGISTRATION_ALLOWLIST:-}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [edge, private]
    logging: *json-logging
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    logging: *json-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-production-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [private]
    logging: *json-logging
    restart: unless-stopped

  migrate:
    build: ./services/api
    entrypoint: ["/migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    logging: *json-logging
    restart: "no"

  api:
    build: ./services/api
    environment:
      <<: *api-environment
      PORT: "8080"
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-arbion_session}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
      FOUNDER_EMAIL: ${FOUNDER_EMAIL:-}
      AI_SERVICE_URL: http://ai:8000
      SCHWAB_CLIENT_ID: ${SCHWAB_CLIENT_ID:-}
      SCHWAB_CLIENT_SECRET: ${SCHWAB_CLIENT_SECRET:-}
      SCHWAB_REDIRECT_URI: ${SCHWAB_REDIRECT_URI:?SCHWAB_REDIRECT_URI is required}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks: [private]
    logging: *json-logging
    restart: unless-stopped

  ai:
    build: ./services/ai
    environment:
      ARBION_ENV: production
      PORT: "8000"
      INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [private]
    logging: *json-logging
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_BASE_URL: http://api:8080
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks: [private]
    logging: *json-logging
    restart: unless-stopped

networks:
  edge:
  private:

volumes:
  postgres-production-data:
  redis-production-data:
  caddy-data:
  caddy-config:
