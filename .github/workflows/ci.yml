name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env && docker compose config --quiet
      - name: Validate production deployment configuration
        env:
          POSTGRES_DB: arbion
          POSTGRES_USER: arbion
          POSTGRES_PASSWORD: ci-validation-not-a-production-secret
          DATABASE_URL: postgres://arbion:ci-validation-not-a-production-secret@postgres:5432/arbion?sslmode=disable
          REDIS_URL: redis://redis:6379/0
          CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AI_INTERNAL_SERVICE_TOKEN: ci-validation-token-0123456789abcdef
          AUTH_ALLOWED_ORIGINS: https://www.arbion.ai
          REGISTRATION_ALLOWLIST: founder@example.com
          SCHWAB_REDIRECT_URI: https://www.arbion.ai/api/connections/financial/schwab/callback
        run: |
          trap 'docker compose -f docker-compose.prod.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml config --format json |
            jq -e '.services.migrate.environment.AUTH_ALLOWED_ORIGINS == "https://www.arbion.ai"' >/dev/null
          docker compose -f docker-compose.prod.yml config --format json |
            jq -e '.services.api.environment.REGISTRATION_ALLOWLIST == "founder@example.com"' >/dev/null
          docker compose -f docker-compose.prod.yml up -d postgres
          docker compose -f docker-compose.prod.yml up --no-deps --exit-code-from migrate migrate
          docker compose -f docker-compose.prod.yml up -d --no-deps --build --wait --wait-timeout 120 web
      - run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: bash -n scripts/backup-postgres.sh scripts/check-host-capacity.sh scripts/check-postgres-backup-freshness.sh scripts/check-production-containers.sh scripts/deploy-production.sh scripts/send-ops-alert.sh scripts/smoke-production.sh scripts/verify-postgres-restore.sh
