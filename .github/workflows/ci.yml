name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  strategy-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: arbion_strategy
          POSTGRES_USER: arbion
          POSTGRES_PASSWORD: ci-integration-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbion -d arbion_strategy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STRATEGY_TEST_DATABASE_URL: postgres://arbion:ci-integration-not-a-production-secret@127.0.0.1:5432/arbion_strategy?sslmode=disable
      AUTH_TEST_DATABASE_URL: postgres://arbion:ci-integration-not-a-production-secret@127.0.0.1:5432/arbion_strategy?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test -race ./internal/strategy -run TestPostgresEvaluationCommitIsAtomicAndModeBound -count=1
      - run: go test -race ./internal/strategy -run TestPostgresAIPaperFillIsAtomicImmutableAndBrokerDisconnected -count=1
      - run: go test -race ./internal/strategy -run TestPostgresCapitalReservationsAllowOnlyExactAggregateSharing -count=1
      - run: go test -race ./internal/auth -run TestPostgresSecurityActivityIsOwnerScopedFilteredAndAppendOnly -count=1
      - run: go test -race ./internal/marketintelligence -run TestPostgresHealthHistoryAggregatesAndPrunesSafeOutcomes -count=1
      - run: go test -race ./internal/marketintelligence -run TestPostgresWatchlistIsOwnerScopedUniqueAndHardBounded -count=1
      - run: go test -race ./internal/orderintent -run TestPostgresOrderIntentIsIdempotentOwnerScopedImmutableAndNonExecuting -count=1
      - run: go test -race ./internal/financialconnection -run TestPostgresConnectionLifecycleIsAccountScoped -count=1
      - run: go test -race ./internal/aiconnection -run TestPostgresAIConnectionDependenciesTrackPreferencesMandatesAndPinnedRuntime -count=1
      - run: go test -race ./internal/risk -run TestPostgresGlobalBreakerIsDurableExclusiveAndSuperadminBound -count=1
      - run: go test -race ./internal/platformops -run TestPostgresSnapshotUsesAggregateSafeTablesAndCurrentAdmin -count=1
      - run: go test -race ./internal/ownerattention -run TestPostgresAttentionIsOwnerScopedCurrentAndCredentialFree -count=1
      - run: go test -race ./internal/liveexecution -run TestPostgresRegistryIsOwnerScopedIdempotentAndImmutable -count=1

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: pip-audit --requirement requirements-dev.lock
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m mypy app
      - run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: cp .env.example .env && docker compose config --quiet
      - name: Validate production deployment configuration
        env:
          POSTGRES_DB: arbion
          POSTGRES_USER: arbion
          POSTGRES_PASSWORD: ci-validation-not-a-production-secret
          DATABASE_URL: postgres://arbion:ci-validation-not-a-production-secret@postgres:5432/arbion?sslmode=disable
          REDIS_URL: redis://redis:6379/0
          CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AI_INTERNAL_SERVICE_TOKEN: ci-validation-token-0123456789abcdef
          AUTH_ALLOWED_ORIGINS: https://www.arbion.ai
          REGISTRATION_ALLOWLIST: founder@example.com
          SCHWAB_REDIRECT_URI: https://www.arbion.ai/api/connections/financial/schwab/callback
        run: |
          trap 'docker compose -f docker-compose.prod.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml config --format json |
            jq -e '.services.migrate.environment.AUTH_ALLOWED_ORIGINS == "https://www.arbion.ai"' >/dev/null
          docker compose -f docker-compose.prod.yml config --format json |
            jq -e '.services.api.environment.REGISTRATION_ALLOWLIST == "founder@example.com"' >/dev/null
          docker compose -f docker-compose.prod.yml config --format json |
            jq -e '[.services.migrate, .services.api, .services.ai, .services.web] | all(.read_only == true and (.privileged // false) == false and .pids_limit == 256 and .cap_drop == ["ALL"] and (.security_opt | index("no-new-privileges:true")))' >/dev/null
          docker compose -f docker-compose.prod.yml up -d postgres
          docker compose -f docker-compose.prod.yml up --no-deps --exit-code-from migrate migrate
          docker compose -f docker-compose.prod.yml up -d --no-deps --build --wait --wait-timeout 120 web
      - run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile
      - run: bash -n scripts/backup-postgres.sh scripts/check-host-capacity.sh scripts/check-memory-pressure.sh scripts/check-postgres-backup-freshness.sh scripts/check-production-containers.sh scripts/check-reboot-required.sh scripts/check-release-hygiene.sh scripts/check-soc2-controls.sh scripts/check-tls-certificate.sh scripts/collect-soc2-external-evidence.sh scripts/collect-soc2-host-evidence.sh scripts/deploy-lightsail-release.sh scripts/deploy-production.sh scripts/lightsail-deploy.test.sh scripts/package-release.sh scripts/release-hygiene.test.sh scripts/send-ops-alert.sh scripts/smoke-production.sh scripts/soc2-controls.test.sh scripts/soc2-evidence-snapshot.test.sh scripts/soc2-host-evidence.test.sh scripts/verify-postgres-restore.sh scripts/verify-soc2-evidence-snapshot.sh scripts/verify-soc2-host-evidence.sh
      - run: ./scripts/release-hygiene.test.sh
      - run: ./scripts/lightsail-deploy.test.sh

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate SOC 2 control baseline
        run: ./scripts/soc2-controls.test.sh
      - name: Verify SOC 2 evidence snapshot integrity controls
        run: ./scripts/soc2-evidence-snapshot.test.sh
      - name: Verify SOC 2 external-control review-draft controls
        run: |
          python3 -m py_compile ./scripts/review-soc2-external-evidence.py ./scripts/soc2-external-review.test.py
          python3 ./scripts/soc2-external-review.test.py
      - name: Verify SOC 2 production-host evidence integrity controls
        run: ./scripts/soc2-host-evidence.test.sh
      - name: Generate control evidence report
        run: |
          mkdir -p artifacts
          ./scripts/check-soc2-controls.sh artifacts/soc2-control-baseline.json
      - name: Retain control evidence report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soc2-control-baseline-${{ github.sha }}
          path: artifacts/soc2-control-baseline.json
          if-no-files-found: error
          retention-days: 90
