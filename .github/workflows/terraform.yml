name: Terraform
on:
  pull_request:
    paths: ["infrastructure/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply production infrastructure (requires production approval)
        required: true
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: hashicorp/setup-terraform@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with: {terraform_version: 1.13.0}
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/bootstrap init -backend=false && terraform -chdir=infrastructure/terraform/bootstrap validate
      - run: terraform -chdir=infrastructure/terraform/environments/production init -backend=false && terraform -chdir=infrastructure/terraform/environments/production validate
  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: hashicorp/setup-terraform@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with: {terraform_version: 1.13.0}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: terraform -chdir=infrastructure/terraform/environments/production init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
      - run: terraform -chdir=infrastructure/terraform/environments/production plan -out=tfplan
      - run: terraform -chdir=infrastructure/terraform/environments/production apply tfplan
