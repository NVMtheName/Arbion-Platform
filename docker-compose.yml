name: arbion

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbion}
      POSTGRES_USER: ${POSTGRES_USER:-arbion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://arbion:local-development-only@postgres:5432/arbion?sslmode=disable}
      ARBION_ENV: ${ARBION_ENV:-development}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-arbion_session}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000}
      FOUNDER_EMAIL: ${FOUNDER_EMAIL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:-local-internal-development-token}
      SCHWAB_CLIENT_ID: ${SCHWAB_CLIENT_ID:-}
      SCHWAB_CLIENT_SECRET: ${SCHWAB_CLIENT_SECRET:-}
      SCHWAB_REDIRECT_URI: ${SCHWAB_REDIRECT_URI:-http://localhost:8080/api/connections/financial/schwab/callback}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: ./services/api
    entrypoint: ["/migrate"]
    environment:
      ARBION_ENV: ${ARBION_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://arbion:local-development-only@postgres:5432/arbion?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai:
    build: ./services/ai
    environment:
      PORT: ${AI_PORT:-8000}
      INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:-local-internal-development-token}
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
      - ai
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
