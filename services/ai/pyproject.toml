[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbion-ai"
version = "0.1.0"
description = "Arbion AI service foundation"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest-asyncio==1.4.0",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
